<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quiz Pixel - Uji pengetahuanmu di 5 mata pelajaran dengan gaya pixel monokrom." />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Quiz</title>
    <style>
      /* Loading screen statis, tampil instan sebelum React selesai dimuat.
         Setelah React mount, komponen LoadingScreen mengambil alih dengan
         animasi progress yang sama sehingga transisinya mulus tanpa "kedip". */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background-color: #111113;
        background-image: linear-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 112px 112px, 112px 112px, 28px 28px, 28px 28px;
      }
      #boot-loader .boot-blocks {
        display: grid;
        grid-template-columns: repeat(3, 16px);
        grid-template-rows: repeat(3, 16px);
        gap: 5px;
        padding: 16px;
        border: 3px solid #f4f4f2;
        background: #19191c;
        box-shadow: 7px 7px 0 0 #000;
      }
      #boot-loader .boot-blocks span {
        width: 16px;
        height: 16px;
        background: #f4f4f2;
        opacity: 0.25;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot-loader .boot-blocks span:nth-child(1) { animation-delay: 0s; }
      #boot-loader .boot-blocks span:nth-child(2) { animation-delay: 0.09s; }
      #boot-loader .boot-blocks span:nth-child(3) { animation-delay: 0.18s; }
      #boot-loader .boot-blocks span:nth-child(4) { animation-delay: 0.27s; }
      #boot-loader .boot-blocks span:nth-child(5) { animation-delay: 0.36s; }
      #boot-loader .boot-blocks span:nth-child(6) { animation-delay: 0.45s; }
      #boot-loader .boot-blocks span:nth-child(7) { animation-delay: 0.54s; }
      #boot-loader .boot-blocks span:nth-child(8) { animation-delay: 0.63s; }
      #boot-loader .boot-blocks span:nth-child(9) { animation-delay: 0.72s; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.18; transform: scale(0.82); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <div class="boot-blocks" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
